<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>

    <style>
        /* Reset default margins and padding, set base font and background */
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at 20% 20%, #ff9a9e 0%, transparent 40%),
                        radial-gradient(circle at 80% 30%, #fad0c4 0%, transparent 40%),
                        radial-gradient(circle at 50% 80%, #a1c4fd 0%, transparent 40%),
                #f7f7ff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Center container with white background and shadow */
        .box {
            background: #fff;
            width: 90%;
            max-width: 420px;
            padding: 30px 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            animation: fadeIn 0.6s ease;
            text-align: center;
        }

        /* Heading styling */
        h2 {
            margin-bottom: 20px;
            font-size: 26px;
            color: #2c3e50;
        }

        /* Result data display styling */
        #result p {
            background: #f7f9fc;
            padding: 12px 14px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: left;
            border: 1px solid #e1e6ef;
        }

        /* Back button styling */
        button {
            background: #4b79a1;
            color: white;
            border: none;
            padding: 12px 18px;
            width: 100%;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s ease;
        }

        /* Button hover effect */
        button:hover {
            background: #3a5f7d;
        }

        /* Fade-in animation for page load */
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(15px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>

</head>
<body>

    <div class="box">
        <h2>Registration Successful!</h2>
        <!-- Container for displaying registration data -->
        <div id="result"></div>

        <!-- Button to navigate back to registration form -->
        <button onclick="goBack()">Back to Registration</button>
    </div>

    <script>
        // Retrieve registration data from sessionStorage (stored by script.js)
        const registrationData = JSON.parse(sessionStorage.getItem('registrationData'));

        // Display registration data if it exists
        if (registrationData) {
            document.getElementById('result').innerHTML = `
                <p><strong>Name:</strong> ${registrationData.name}</p>
                <p><strong>Email:</strong> ${registrationData.email}</p>
                <p><strong>Date of Birth:</strong> ${registrationData.dob}</p>
                <p><strong>Password:</strong> ${registrationData.password}</p>
            `;
        }

        // Navigate back to previous page (registration form)
        function goBack() {
            window.history.back();
        }
    </script>

</body>
</html>
